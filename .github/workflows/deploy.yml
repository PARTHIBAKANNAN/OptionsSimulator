name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-optionssimulator-vm
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
      - name: Import smoke test
        env:
          SESSION_SECRET: ci-placeholder
        run: python -c "from backend.app.main import app; print('backend imports OK')"
      - name: Run tests
        env:
          SESSION_SECRET: ci-placeholder
        run: pytest tests/ backend/tests/ -q

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /home/ubuntu/optionssimulator-app
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            PREV_SHA="$PREV_SHA" bash deploy/deploy.sh
