# Manual, one-time edit to the VM's existing /etc/caddy/Caddyfile (shared with TradeDashBoard —
# not something deploy.sh touches automatically). Insert this block INSIDE the existing
# `trading-dashboard-1.duckdns.org { ... }` site block, BEFORE TradeDashBoard's own bare
# `handle { ... }` catch-all (Caddy matches handles in order — a catch-all placed first would
# swallow these paths before they're ever seen).
#
# handle_path strips the "/options-simulator" prefix once; the nested handles then see the same
# clean /api/*, /ws/*, / paths the backend itself expects (matching TradeDashBoard's own
# structure, just nested one level deeper).

    handle_path /options-simulator/* {
        handle /api/* {
            reverse_proxy localhost:8001
        }
        handle /ws/* {
            reverse_proxy localhost:8001
        }
        handle {
            root * /home/ubuntu/optionssimulator-app/frontend/dist
            file_server
            try_files {path} /index.html
        }
    }

# After editing, validate + reload (does not drop TradeDashBoard's existing connections):
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
