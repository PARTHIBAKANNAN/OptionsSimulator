# Dedicated VM Caddyfile configuration for OptionsSimulator (NukeBox)
# Served at https://nukebox.duckdns.org with automatic HTTPS/TLS.

nukebox.duckdns.org {
    handle /options-simulator/api/* {
        uri strip_prefix /options-simulator
        reverse_proxy localhost:8001
    }
    handle /options-simulator/ws/* {
        uri strip_prefix /options-simulator
        reverse_proxy localhost:8001
    }
    handle /options-simulator/* {
        uri strip_prefix /options-simulator
        root * /home/ubuntu/optionssimulator-app/frontend/dist
        file_server
        try_files {path} /index.html
    }

    handle /api/* {
        reverse_proxy localhost:8001
    }
    handle /ws/* {
        reverse_proxy localhost:8001
    }
    handle {
        root * /home/ubuntu/optionssimulator-app/frontend/dist
        file_server
        try_files {path} /index.html
    }
}

:80 {
    handle /options-simulator/api/* {
        uri strip_prefix /options-simulator
        reverse_proxy localhost:8001
    }
    handle /options-simulator/ws/* {
        uri strip_prefix /options-simulator
        reverse_proxy localhost:8001
    }
    handle /options-simulator/* {
        uri strip_prefix /options-simulator
        root * /home/ubuntu/optionssimulator-app/frontend/dist
        file_server
        try_files {path} /index.html
    }

    handle /api/* {
        reverse_proxy localhost:8001
    }
    handle /ws/* {
        reverse_proxy localhost:8001
    }
    handle {
        root * /home/ubuntu/optionssimulator-app/frontend/dist
        file_server
        try_files {path} /index.html
    }
}
