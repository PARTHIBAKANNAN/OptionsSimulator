<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NUKEBOX | Autonomous Quantitative Derivatives Terminal</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NukeBox" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <link rel="icon" type="image/svg+xml" href="/assets/nukebox_logo.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    
    <script>
      // Applied before paint to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("theme");
        var theme = saved || "dark";
        document.documentElement.classList.add(theme);
      })();

      // Register Service Worker for PWA installation
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("PWA ServiceWorker registration failed: ", err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-surface text-primary antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
