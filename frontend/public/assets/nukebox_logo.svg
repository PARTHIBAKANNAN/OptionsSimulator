<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Seamless Full-Bleed Background Gradient -->
    <linearGradient id="nbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="25%" stop-color="#0077ff" />
      <stop offset="65%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#070c1b" />
    </linearGradient>

    <!-- Center Atmospheric Depth Glow -->
    <radialGradient id="nbGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#00e5ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Candlestick Body Gradient -->
    <linearGradient id="candleBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f6fc" />
    </linearGradient>

    <!-- Trendline Neon Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#00081a" flood-opacity="0.55" />
    </filter>

    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Full-Bleed 100% Background (Corner-to-Corner, no inner padding, no pre-rounded corners) -->
  <rect width="1024" height="1024" fill="url(#nbBg)" />
  <rect width="1024" height="1024" fill="url(#nbGlow)" />

  <!-- 2. Centered Candlesticks (Scaled within Apple HIG safe zone) -->
  <g filter="url(#softShadow)">
    <!-- Left Candle -->
    <line x1="340" y1="240" x2="340" y2="760" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" />
    <rect x="275" y="360" width="130" height="280" rx="20" fill="url(#candleBody)" />

    <!-- Center Master Candle (Dominant Bullish Bar) -->
    <line x1="512" y1="170" x2="512" y2="830" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <rect x="442" y="270" width="140" height="460" rx="22" fill="url(#candleBody)" />

    <!-- Right Candle -->
    <line x1="684" y1="240" x2="684" y2="760" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" />
    <rect x="619" y="400" width="130" height="240" rx="20" fill="url(#candleBody)" />
  </g>

  <!-- 3. Ascending Kinetic Breakout Trendline with Arrowhead -->
  <g filter="url(#arrowGlow)">
    <!-- Origin Pulse Node -->
    <circle cx="160" cy="560" r="32" fill="#ffffff" />
    
    <!-- Dynamic Zigzag Track -->
    <path d="M 160 560 L 340 420 L 512 660 L 800 310" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Breakout Arrowhead Pointing Top-Right -->
    <path d="M 690 295 L 855 260 L 820 425 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>