<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nbBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#000d2e" />
    </linearGradient>
    <linearGradient id="nbRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Box with Premium Fintech Gradient -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#nbBoxGrad)" stroke="url(#nbRimGrad)" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- 3 Candlestick Bodies and Wicks -->
  <!-- Left Candle -->
  <line x1="32" y1="22" x2="32" y2="76" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <rect x="25.5" y="34" width="13" height="30" rx="2" fill="#ffffff" />

  <!-- Middle Candle (Tallest) -->
  <line x1="50" y1="14" x2="50" y2="84" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <rect x="43.5" y="24" width="13" height="48" rx="2" fill="#ffffff" />

  <!-- Right Candle -->
  <line x1="68" y1="22" x2="68" y2="76" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <rect x="61.5" y="38" width="13" height="26" rx="2" fill="#ffffff" />

  <!-- Kinetic Ascending Zigzag Trendline & Arrow -->
  <!-- Starting Origin Node -->
  <circle cx="14" cy="54" r="4" fill="#ffffff" />

  <!-- Zigzag Path -->
  <path d="M 14 54 L 32 40 L 50 64 L 79 30" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Breakout Arrowhead -->
  <path d="M 68 28 L 84 25 L 81 41 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
</svg>
